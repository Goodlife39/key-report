<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>HLB8</title>

<style>

/* =====================================================
   基础
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;

    background: white;
    color: #111;

    font-family: Arial, Helvetica, sans-serif;
}


/* =====================================================
   HOME
===================================================== */

#homePage {
    display: block;

    width: 100%;
    min-height: 100vh;

    background: #eef8ff;
}


/* =====================================================
   首页顶部
===================================================== */

.home-header {

    height: 55px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 10px;

    background: white;

    border-bottom: 1px solid #ddd;
}

.home-update {

    width: 80px;

    color: #0066ff;

    font-size: 18px;

    text-align: left;
}

.home-title {

    flex: 1;

    text-align: center;

    font-size: 20px;
}

.home-logout {

    width: 80px;

    color: #0066ff;

    font-size: 18px;

    text-align: right;

    cursor: pointer;
}


/* =====================================================
   首页 2 x 3
===================================================== */

.home-grid {

    display: grid;

    grid-template-columns: repeat(2, 1fr);

    grid-template-rows: repeat(3, 1fr);

    width: 100%;

    min-height: calc(100vh - 55px);

    background: #eef8ff;

    border-top: 1px solid #d8dfe3;
    border-left: 1px solid #d8dfe3;
}


/* =====================================================
   首页格子
===================================================== */

.home-item {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    min-height: 220px;

    background: #eef8ff;

    border-right: 1px solid #d8dfe3;
    border-bottom: 1px solid #d8dfe3;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

.home-item:active {

    background: #dfeffc;
}


/* =====================================================
   首页文字
===================================================== */

.home-label {

    color: #222;

    font-size: 19px;

    text-align: center;
}


/* =====================================================
   新单图标
===================================================== */

.new-order-icon {

    position: relative;

    width: 88px;
    height: 88px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin-bottom: 15px;

    border-radius: 50%;

    background:
        conic-gradient(
            #e52229 0deg 45deg,
            #f5f5f5 45deg 90deg,
            #e52229 90deg 145deg,
            #f5f5f5 145deg 195deg,
            #e52229 195deg 250deg,
            #f5f5f5 250deg 305deg,
            #e52229 305deg 360deg
        );

    box-shadow:
        0 2px 5px rgba(0,0,0,0.12);
}

.ticket-small {

    width: 57px;
    height: 31px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #f5b51b;

    color: white;

    font-size: 12px;
    font-weight: bold;

    transform: rotate(-15deg);
}

.plus-circle {

    position: absolute;

    right: -4px;
    bottom: -4px;

    width: 34px;
    height: 34px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #35c95a;

    color: white;

    font-size: 30px;
    font-weight: bold;
}


/* =====================================================
   首页其他图标
===================================================== */

.home-icon {

    width: 95px;
    height: 95px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin-bottom: 15px;

    font-size: 70px;

    line-height: 1;
}

.person-icon {
    font-size: 72px;
}

.report-icon {
    font-size: 72px;
}

.chart-icon {
    font-size: 72px;
}

.settings-icon {
    font-size: 74px;
}


/* =====================================================
   红色 1
===================================================== */

.number-one {

    width: 92px;
    height: 92px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin-bottom: 15px;

    border: 7px solid #ed1111;

    border-radius: 16px;

    background: white;

    color: #e50000;

    font-size: 58px;
    font-weight: bold;
}


/* =====================================================
   INPUT PAGE
===================================================== */

#inputPage {

    display: none;

    min-height: 100vh;

    padding-bottom: 245px;

    background: white;
}


/* =====================================================
   Input 顶部
===================================================== */

.header {

    height: 55px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 0 15px;

    border-bottom: 1px solid #ddd;

    background: white;
}

.header-left {

    color: #0066ff;

    font-size: 21px;

    cursor: pointer;
}

.header-title {

    font-size: 23px;

    font-weight: bold;
}


.header-product-switch {
    display: flex;
    flex: 1;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-width: 0;
}

.product-switch-button {
    min-height: 34px;
    padding: 0 10px;
    border: 1px solid #1689e8;
    border-radius: 5px;
    background: #fff;
    color: #1689e8;
    font-size: 15px;
    font-weight: normal;
    white-space: nowrap;
}

.product-switch-button.active {
    background: #1689e8;
    color: #fff;
}

.header-actions {

    display: flex;

    align-items: center;

    gap: 18px;
}

.header-rebuy,
.header-buy {

    color: #0066ff;

    font-size: 19px;

    cursor: pointer;
}


/* =====================================================
   户口
===================================================== */

.account {

    padding: 16px 15px 8px;

    font-size: 18px;

    font-weight: bold;
}


/* =====================================================
   日期
===================================================== */

.date-row {

    width: 100%;

    padding: 4px 15px 0;
}

#dateInput {

    width: 100%;

    height: 42px;

    padding: 0;

    border: none;

    outline: none;

    background: white;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 21px;

    font-weight: bold;

    color: #111;
}


/* =====================================================
   号码输入
===================================================== */

#dInput {

    display: block;

    width: 100%;

    min-height: 390px;

    padding: 4px 15px 15px;

    border: none;

    outline: none;

    resize: none;

    background-color: white;

    background-image: none;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 19px;

    line-height: 1.65;

    color: #111;

    caret-color: #111;
}


/* =====================================================
   金额
===================================================== */

.amount-bar {

    position: fixed;

    left: 0;
    right: 0;

    bottom: 245px;

    height: 40px;

    display: none;

    align-items: center;

    justify-content: flex-end;

    padding-right: 12px;

    background: white;

    z-index: 20;
}

.amount {

    font-size: 18px;

    font-weight: bold;
}


/* =====================================================
   键盘
===================================================== */

.keypad {

    position: fixed;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 245px;

    display: none;

    grid-template-columns: repeat(4, 1fr);

    grid-template-rows: repeat(4, 1fr);

    background: #ddd;

    z-index: 30;
}

.key {

    border: 1px solid #aaa;

    border-radius: 0;

    background:
        linear-gradient(
            to bottom,
            #ffffff 0%,
            #f6f6f6 50%,
            #e5e5e5 100%
        );

    font-size: 29px;

    color: #111;

    cursor: pointer;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;
}

.key:active {

    background: #ccc;
}

.backspace {

    font-size: 25px;
}

.clear-key {

    background: #ed1515;

    color: white;

    font-size: 24px;

    font-weight: bold;
}

.clear-key:active {

    background: #bf0000;
}

.bet-key,
.enter-key {

    background: #079a42;

    color: white;

    font-size: 24px;

    font-weight: bold;
}

.bet-key:active,
.enter-key:active {

    background: #067533;
}


/* =====================================================
   REPORT LIST PAGE
===================================================== */

#reportPage {

    display: none;

    min-height: 100vh;

    background: white;

    padding-bottom: 20px;
}


/* =====================================================
   Report 顶部
===================================================== */

.report-header {

    height: 55px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 0 15px;

    border-bottom: 1px solid #ddd;

    background: white;

    position: sticky;

    top: 0;

    z-index: 50;
}

.report-back {

    width: 80px;

    color: #0066ff;

    font-size: 21px;

    cursor: pointer;
}

.report-title {

    flex: 1;

    text-align: center;

    font-size: 23px;

    font-weight: bold;
}

.report-new {

    width: 80px;

    color: #0066ff;

    font-size: 19px;

    text-align: right;

    cursor: pointer;
}


/* =====================================================
   Report 搜索区域
===================================================== */

.report-search {

    padding: 10px 10px 8px;

    background: white;

    border-bottom: 1px solid #ddd;
}


/* 日期 */

.search-date-row {

    display: flex;

    align-items: center;

    gap: 6px;

    margin-bottom: 8px;
}

.search-date-label {

    font-size: 17px;

    white-space: nowrap;
}

#searchDate {

    flex: 1;

    min-width: 0;

    height: 40px;

    padding: 0 8px;

    border: 1px solid #888;

    background: white;

    font-size: 17px;

    outline: none;
}

.search-button {

    height: 40px;

    padding: 0 14px;

    border: none;

    border-radius: 5px;

    background: #1689e8;

    color: white;

    font-size: 17px;

    cursor: pointer;
}


/* 编号 / 号码 */

.search-two-row {

    display: flex;

    align-items: center;

    gap: 8px;

    width: 100%;
}

.search-group {

    flex: 1;

    min-width: 0;

    display: flex;

    align-items: center;

    gap: 5px;
}

.search-label {

    font-size: 16px;

    white-space: nowrap;
}

.search-input {

    flex: 1;

    min-width: 0;

    height: 38px;

    padding: 0 7px;

    border: 1px solid #999;

    outline: none;

    font-size: 16px;

    background: white;
}

.search-box-row {
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    margin-top:8px;
}
.search-box-row .search-input { flex:1; }

.search-small-button {

    height: 38px;

    padding: 0 9px;

    border: none;

    border-radius: 5px;

    background: #1689e8;

    color: white;

    font-size: 15px;

    white-space: nowrap;

    cursor: pointer;
}


/* =====================================================
   Report 列表
===================================================== */

#reportList {

    padding: 10px;

    background: white;
}


/* =====================================================
   单张 Report
===================================================== */

.report-card {

    position: relative;

    margin-bottom: 10px;

    padding: 14px 14px 48px;

    background: #eef8ff;

    border: 1px solid #dce5eb;

    border-radius: 8px;

    color: #111;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 18px;

    line-height: 1.55;

    white-space: pre-wrap;

    word-break: break-word;
}


/* 废票 */

.report-card.cancelled {

    background: #ffc8f3;

    color: #d40000;

    border-color: #f2a9e1;
}



/* 豪龙收据样式 */
.report-card.haolong-card {
    padding: 0 0 48px;
    background: #fff;
    border-color: #e5e5e5;
    border-radius: 8px;
}

.report-card.haolong-card.cancelled {
    background: #ffcbd2;
    color: #111;
    border-color: #e6a0aa;
}

.report-card.haolong-card.cancelled .haolong-report-title { background:#a00000; }
.haolong-deleted-at { color:#e33443; }
.haolong-cancel-source-line { color:#0000ee; }

.haolong-report-title {
    padding: 7px 12px;
    background: #a0a0a0;
    color: #fff;
    text-align: center;
    font-weight: bold;
    line-height: 1.5;
    border-radius: 7px 7px 0 0;
}

.haolong-report-content {
    padding: 14px 14px 18px;
    color: #111;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 18px;
    line-height: 1.55;
    white-space: pre-wrap;
}

.haolong-report-line {
    min-height: 1.55em;
}

.haolong-report-blue {
    color: #0000ee;
}
/* 删除按钮 */

.report-delete {

    position: absolute;

    right: 10px;

    bottom: 9px;

    height: 32px;

    padding: 0 15px;

    border: none;

    border-radius: 5px;

    background: #ed1515;

    color: white;

    font-size: 15px;

    cursor: pointer;
}

.report-delete:active {

    background: #b90000;
}


.report-rebuy {

    position: absolute;

    right: 82px;

    bottom: 9px;

    height: 32px;

    padding: 0 15px;

    border: none;

    border-radius: 5px;

    background: #1689e8;

    color: white;

    font-size: 15px;

    cursor: pointer;
}


.report-rebuy:active {

    background: #0d6fc0;
}



.report-screenshot {
    position: absolute;
    right: 154px;
    bottom: 9px;
    height: 32px;
    padding: 0 13px;
    border: none;
    border-radius: 5px;
    background: #159447;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

.report-screenshot:active { background: #0d7134; }

/* 废票标记 */

.cancel-label {

    color: #d40000;

    font-weight: bold;

    margin-bottom: 6px;
}


/* 没有结果 */

.no-result {

    padding: 35px 10px;

    text-align: center;

    color: #777;

    font-size: 17px;
}


/* =====================================================
   手机
===================================================== */

/* BET 后的收据弹窗 */
.receipt-modal { display:none; position:fixed; inset:0; z-index:2000; align-items:center; justify-content:center; padding:16px; background:rgba(0,0,0,.48); }
.receipt-modal-dialog { display:flex; flex-direction:column; width:min(560px, 100%); max-height:85vh; overflow:hidden; border-radius:10px; background:#fff; box-shadow:0 8px 30px rgba(0,0,0,.25); }
.receipt-modal-title { flex:none; padding:11px 14px; background:#a0a0a0; color:#fff; text-align:center; font-size:20px; font-weight:bold; }
.receipt-modal-content { flex:1; overflow:auto; padding:16px; background:#eef8ff; color:#111; font-family:Arial, Helvetica, sans-serif; font-size:18px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
.receipt-modal-content.haolong-report-content { background:#fff; }
.receipt-modal-actions { display:flex; justify-content:flex-end; gap:10px; flex:none; padding:11px 13px; border-top:1px solid #ddd; background:#fff; }
.receipt-modal-button { min-width:82px; height:40px; border:0; border-radius:5px; color:#fff; font-size:17px; }
.receipt-modal-screenshot { background:#1689e8; }
.receipt-modal-ok { background:#159447; }
@media (max-width: 600px) { .receipt-modal { padding:12px; } .receipt-modal-dialog { max-height:88vh; } }

/* 独立粘贴下单页 */
#pasteOrderPage { display:none; min-height:100vh; padding:0 12px 20px; background:#f6f7fb; }
.paste-order-header { height:55px; margin:0 -12px 12px; display:flex; align-items:center; justify-content:space-between; padding:0 14px; border-bottom:1px solid #ddd; background:#fff; }
.paste-order-back { color:#06f; font-size:20px; cursor:pointer; }
.paste-order-title { font-size:21px; font-weight:bold; }
.paste-order-spacer { width:55px; }
.paste-order-account { display:flex; gap:10px; margin-bottom:10px; }
.paste-order-account > div { flex:1; min-width:0; padding:12px; border:1px solid #bfc1c8; border-radius:9px; background:#fff; color:#555; font-size:17px; }
.paste-order-label { display:block; margin-bottom:5px; color:#777; font-size:14px; }
.paste-order-products { display:flex; gap:8px; margin:10px 0; }
.paste-order-products button { flex:1; min-height:42px; border:1px solid #1689e8; border-radius:6px; background:#fff; color:#1689e8; font-size:17px; }
.paste-order-products button.active { background:#1689e8; color:#fff; }
#pasteOrderDate { width:100%; height:44px; margin:0 0 10px; padding:0 12px; border:1px solid #bfc1c8; border-radius:7px; background:#fff; font-size:18px; }
.paste-order-amount-row { display:flex; gap:10px; margin-bottom:12px; }
#pasteOrderAmount { flex:1; display:flex; align-items:center; justify-content:center; min-height:52px; border:2px solid #1689e8; border-radius:8px; color:#1689e8; font-size:22px; font-weight:bold; }
.paste-order-buy { flex:0 0 38%; min-height:52px; border:0; border-radius:8px; background:#32ad50; color:#fff; font-size:20px; }
#pasteOrderNumbers { display:block; width:100%; min-height:38vh; padding:15px; border:2px solid #1689e8; border-radius:10px; outline:none; background:#fff; font:20px/1.6 Arial, Helvetica, sans-serif; resize:vertical; }
.paste-order-keypad { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; margin-top:8px; padding:5px; border-radius:9px; background:#e5e5e5; }
.paste-order-keypad button { min-width:0; min-height:64px; border:0; border-radius:8px; background:#606060; color:#fff; font-size:24px; font-weight:bold; touch-action:manipulation; }
.paste-order-keypad .paste-order-keypad-tools { grid-column:1/-1; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
.paste-order-keypad-tools button { min-height:52px; font-size:18px; }
.paste-order-keypad .paste-key-del { background:#d91d2a; }
.paste-order-keypad .paste-key-enter { background:#444; }
@media (max-width:480px) { #pasteOrderNumbers { min-height:30vh; } .paste-order-keypad button { min-height:58px; } }

/* 按日期查询号码 */
#dailyNumberPage { display:none; min-height:100vh; padding-bottom:20px; background:#f5f7fa; }
.daily-number-header { position:sticky; top:0; z-index:50; height:55px; display:flex; align-items:center; justify-content:space-between; padding:0 15px; border-bottom:1px solid #ddd; background:#fff; }
.daily-number-back { width:80px; color:#287C78; font-size:21px; cursor:pointer; }
.daily-number-title { flex:1; text-align:center; font-size:22px; font-weight:bold; }
.daily-number-spacer { width:80px; }
.daily-number-tabs { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; padding:10px; background:#fff; }
.daily-number-tabs button { min-height:40px; padding:5px 7px; border:1px solid #287C78; border-radius:6px; background:#fff; color:#287C78; font-size:15px; }
.daily-number-tabs button.active { background:#287C78; color:#fff; }
.daily-number-search { display:flex; align-items:center; gap:8px; padding:12px 10px; background:#fff; border-bottom:1px solid #ddd; }
.daily-number-search label { white-space:nowrap; font-size:17px; }
#dailyNumberDate { flex:1; min-width:0; height:42px; padding:0 8px; border:1px solid #888; background:#fff; font-size:17px; }
.daily-number-search button { height:42px; padding:0 16px; border:0; border-radius:5px; background:#287C78; color:#fff; font-size:17px; }
.daily-number-search .daily-number-copy { padding:0 12px; background:#159447; }
#dailyNumberResults { padding:10px; }
.daily-number-group { margin-bottom:10px; padding:0 12px 10px; border:1px solid #e2e5e8; border-radius:7px; background:#fff; }
.daily-number-group-title { margin:0 -12px 8px; padding:8px 12px; border-bottom:1px solid #e5e5e5; background:#EAF4F3; color:#287C78; font-size:20px; font-weight:bold; }
.daily-number-total .daily-number-group-title { background:#287C78; color:#fff; }
.daily-number-total .amount-ticket-title { background:#287C78; color:#fff; }
.daily-number-summary { margin-bottom:6px; color:#287C78; font-weight:bold; }
.daily-number-group:not(.daily-number-total) .daily-number-line { margin:2px 0; padding:3px 6px; border-radius:4px; background:#F3F8F7; }
.daily-number-line { padding:3px 0; color:#111; font-size:18px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
.amount-type-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:2px; text-align:right; }
.amount-type-header { width:min(266px,calc(100vw - 100px)); margin:0 0 4px auto; padding:5px 0; border-bottom:1px solid #dce3e8; color:#287C78; font-size:12px; font-weight:bold; }
.amount-number-row { display:grid; grid-template-columns:60px minmax(0,1fr); align-items:center; gap:4px; margin:2px 0; padding:5px 4px; border-bottom:1px solid #edf0f2; border-radius:5px; background:#F3F8F7; }
.amount-number-row:last-child { border-bottom:0; }
.amount-number-row strong { display:block; font-size:17px; }
.amount-type-values { width:min(266px,calc(100vw - 100px)); margin-left:auto; align-items:center; color:#333; font-size:11px; white-space:nowrap; }
.amount-type-values span { justify-self:end; min-width:0; padding:2px 2px; border:1px solid #d9e8f5; border-radius:10px; background:#f4f9fd; text-align:center; overflow:hidden; }
.amount-type-values span.amount-over-five { border-color:#f2a8c4; background:#ffdce9; color:#b4235a; }
.daily-number-empty { padding:24px 10px; color:#777; text-align:center; font-size:17px; }

@media (max-width: 600px) {

    .home-item {

        min-height: 0;
    }

    .home-icon {

        width: 82px;
        height: 82px;

        font-size: 62px;
    }

    .new-order-icon {

        width: 82px;
        height: 82px;
    }

    .person-icon,
    .report-icon,
    .chart-icon {

<script>


/* =====================================================
   页面
===================================================== */

const homePage =
    document.getElementById("homePage");

const inputPage =
    document.getElementById("inputPage");

const reportPage =
    document.getElementById("reportPage");

const dailyNumberPage =
    document.getElementById("dailyNumberPage");
const pasteOrderPage = document.getElementById("pasteOrderPage");
const pasteOrderNumbers = document.getElementById("pasteOrderNumbers");
const pasteOrderDate = document.getElementById("pasteOrderDate");

const dailyNumberDate =
    document.getElementById("dailyNumberDate");

const dailyNumberTitle =
    document.getElementById("dailyNumberTitle");

const dailyNumberResults =
    document.getElementById("dailyNumberResults");

const receiptModal = document.getElementById("receiptModal");
const receiptModalContent = document.getElementById("receiptModalContent");
const receiptModalTitle = document.getElementById("receiptModalTitle");
let currentReceiptModalId = null;
let dailyNumberProductFilter = "all";
let dailyNumbersForCopy = [];

const amountBar =
    document.getElementById("amountBar");

const keypad =
    document.getElementById("keypad");

const dateInput =
    document.getElementById("dateInput");

const numberInput =
    document.getElementById("dInput");

const searchDate =
    document.getElementById("searchDate");

const searchId =
    document.getElementById("searchId");

const searchNumber =
    document.getElementById("searchNumber");

const searchBoxNumber = document.getElementById("searchBoxNumber");


let activeInput =
    dateInput;

// 新单默认让数字键盘写入号码区；只有点日期行后才改写日期。
let preferNumberInput = false;

let activeProduct =
    "hlb8";


function getProductLabel() {

    return activeProduct === "haolong"
        ? "豪龙"
        : "hlb8";

}


function getReportsStorageKey() {

    return activeProduct === "haolong"
        ? "haolong_reports"
        : "hlb8_reports";

}


function getCounterStorageKey(dayStamp) {

    return activeProduct === "haolong"
        ? `haolong_generate_count_${dayStamp}`
        : `hlb8_generate_count_${dayStamp}`;

}


/* =====================================================
   页面切换
===================================================== */

function showPage(page) {

    homePage.style.display = "none";
    inputPage.style.display = "none";
    reportPage.style.display = "none";
    dailyNumberPage.style.display = "none";
    pasteOrderPage.style.display = "none";
    amountBar.style.display = "none";
    keypad.style.display = "none";

    if (page === "home") {
        homePage.style.display = "block";
    }

    if (page === "input") {
        inputPage.style.display = "block";
        amountBar.style.display = "flex";
        keypad.style.display = "grid";
    }

    if (page === "report") {
        reportPage.style.display = "block";
        renderReports();
    }

    if (page === "dailyNumbers") {
        dailyNumberPage.style.display = "block";
        renderDailyNumbers();
    }

    if (page === "pasteOrder") {
        pasteOrderPage.style.display = "block";
    }

}



/* =====================================================
   今天日期
===================================================== */

function getTodayString() {

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            now.getDate()
        ).padStart(2, "0");

    return `${year}/${month}/${day}`;

}


/* =====================================================
   日期转换
===================================================== */

function normalizeDateString(value) {

    const text =
        String(value || "")
            .trim();

    if (!text) {

        return "";

    }


    const match =
        text.match(
            /^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/
        );


    if (!match) {

        return text;

    }


    return (
        match[1] +
        "/" +
        String(
            parseInt(match[2], 10)
        ).padStart(2, "0") +
        "/" +
        String(
            parseInt(match[3], 10)
        ).padStart(2, "0")
    );

}


/* =====================================================
   初始化日期
===================================================== */

dateInput.value =
    "D#";

searchDate.value =
    getTodayString().replace(/\//g, "-");


/* =====================================================
   首页 → 新单
===================================================== */

function updateInputProductSwitch() {
    const hlb8Button = document.getElementById("hlb8SwitchButton");
    const haolongButton = document.getElementById("haolongSwitchButton");
    if (!hlb8Button || !haolongButton) return;

    hlb8Button.classList.toggle("active", activeProduct === "hlb8");
    haolongButton.classList.toggle("active", activeProduct === "haolong");
    hlb8Button.setAttribute("aria-pressed", activeProduct === "hlb8" ? "true" : "false");
    haolongButton.setAttribute("aria-pressed", activeProduct === "haolong" ? "true" : "false");
}


function switchInputProduct(product) {
    if (product !== "hlb8" && product !== "haolong") return;

    activeProduct = product;
    document.getElementById("accountLabel").textContent =
        `户口: ${getProductLabel()}`;
    updateInputProductSwitch();
    updateAmount();
}


function openInputPage(product) {

    if (product) {

        activeProduct = product;

    }

    document.getElementById("accountLabel").textContent =
        `户口: ${getProductLabel()}`;

    updateInputProductSwitch();
    showPage("input");

    // 新单打开时，光标直接停在 D# 下方的第一行号码输入区。
    activeInput = numberInput;
    preferNumberInput = true;
    numberInput.focus();
    numberInput.setSelectionRange(0, 0);
    updateActiveLineHighlight();

}


/* =====================================================
   独立粘贴下单
===================================================== */

function openPasteOrderPage() {
    activeProduct = "haolong";
    pasteOrderDate.value = dateInput.value || "D#";
    pasteOrderNumbers.value = "";
    updatePasteOrderProduct();
    updatePasteOrderTotal();
    showPage("pasteOrder");
}

function setPasteOrderProduct(product) {
    if (product !== "hlb8" && product !== "haolong") return;
    activeProduct = product;
    updatePasteOrderProduct();
    updatePasteOrderTotal();
}

function updatePasteOrderProduct() {
    document.getElementById("pasteOrderAccount").textContent =
        activeProduct === "haolong" ? "GX999" : "hlb8";
    document.getElementById("pasteHlb8Button").classList.toggle("active", activeProduct === "hlb8");
    document.getElementById("pasteHaolongButton").classList.toggle("active", activeProduct === "haolong");
}

function updatePasteOrderTotal() {
    const pasted = pasteOrderNumbers.value.trim();
    dateInput.value = pasteOrderDate.value.trim() || "D#";
    numberInput.value = pasted;
    if (!pasted) {
        document.getElementById("pasteOrderAmount").textContent = "MYR 0.00";
        return;
    }
    updateAmount();
    const amount = document.getElementById("amountDisplay").textContent.replace(/^\$/, "");
    document.getElementById("pasteOrderAmount").textContent = `MYR ${amount}`;
}

function pasteOrderKey(key) {
    const field = pasteOrderNumbers;
    field.focus();
    const start = field.selectionStart ?? field.value.length;
    const end = field.selectionEnd ?? start;
    let value = field.value;
    let cursor = start;
    if (key === "DEL") {
        if (start !== end) value = value.slice(0, start) + value.slice(end);
        else if (start > 0) { value = value.slice(0, start - 1) + value.slice(end); cursor = start - 1; }
    } else {
        const inserted = key === "ENTER" ? "\n" : key;
        value = value.slice(0, start) + inserted + value.slice(end);
        cursor = start + inserted.length;
    }
    field.value = value;
    field.setSelectionRange(cursor, cursor);
    updatePasteOrderTotal();
}

function savePasteOrderDraft() {
    try {
        localStorage.setItem("pasteOrderDraftV1", JSON.stringify({
            date: pasteOrderDate.value,
            product: activeProduct,
            numbers: pasteOrderNumbers.value
        }));
        alert("已保存这份粘贴新单草稿。");
    } catch (error) { alert("保存失败，浏览器可能未允许本地存储。"); }
}

function loadPasteOrderDraft() {
    try {
        const raw = localStorage.getItem("pasteOrderDraftV1");
        if (!raw) { alert("没有找到已保存的草稿。"); return; }
        const draft = JSON.parse(raw);
        pasteOrderDate.value = draft.date || "D#";
        pasteOrderNumbers.value = draft.numbers || "";
        if (draft.product === "hlb8" || draft.product === "haolong") activeProduct = draft.product;
        updatePasteOrderProduct();
        updatePasteOrderTotal();
        pasteOrderNumbers.focus();
    } catch (error) { alert("读取草稿失败。"); }
}

async function pasteOrderFromClipboard() {
    try {
        if (!navigator.clipboard || !navigator.clipboard.readText) throw new Error("clipboard unavailable");
        const text = await navigator.clipboard.readText();
        if (text) {
            pasteOrderNumbers.value = text;
            updatePasteOrderTotal();
        }
        pasteOrderNumbers.focus();
    }
    catch (error) {
        pasteOrderNumbers.focus();
        alert("请在号码框长按并选择“粘贴”，或使用键盘 Ctrl+V。");
    }
}

function clearPasteOrder() {
    pasteOrderNumbers.value = "";
    updatePasteOrderTotal();
    pasteOrderNumbers.focus();
}

function buyPasteOrder() {
    const pasted = pasteOrderNumbers.value.trim();
    if (!pasted) {
        alert("请先粘贴号码。");
        pasteOrderNumbers.focus();
        return;
    }
    dateInput.value = pasteOrderDate.value.trim() || "D#";
    numberInput.value = pasted;
    generateReport();
}

pasteOrderNumbers.addEventListener("input", updatePasteOrderTotal);
pasteOrderDate.addEventListener("input", updatePasteOrderTotal);

/* =====================================================
   返回首页
===================================================== */

function backToHome() {

    showPage("home");

}


/* =====================================================
   首页 → 检查
===================================================== */

function openCheckPage(product) {

    if (product) {

        activeProduct = product;

    }

    searchDate.value =
        getTodayString().replace(/\//g, "-");

    searchId.value =
        "";

    searchNumber.value =
        "";

    showPage("report");

}

function openDailyNumberPage(productScope = "amount-total") {
    dailyNumberDate.value = getTodayString().replace(/\//g, "-");
    showPage("dailyNumbers");
    switchDailyNumberMode(productScope);
}

function switchDailyNumberMode(productScope) {
    const allowedScopes = ["all", "hlb8", "hlb8-total", "amount-total"];
    if (!allowedScopes.includes(productScope)) return;

    dailyNumberProductFilter = productScope;
    const titles = {
        all: "号码查询",
        hlb8: "新单号码查询",
        "hlb8-total": "新单号码总数",
        "haolong-total": "豪龙合计",
        "amount-total": "金额合计"
    };
    dailyNumberTitle.textContent = titles[productScope];
    document.querySelectorAll(".daily-number-tabs button").forEach(button => {
        button.classList.toggle("active", button.dataset.scope === productScope);
        button.setAttribute("aria-selected", button.dataset.scope === productScope ? "true" : "false");
    });
    const copyButton = document.getElementById("dailyNumberCopyButton");
    copyButton.style.display = productScope === "hlb8-total" || productScope === "haolong-total" ? "block" : "none";
    renderDailyNumbers();
}

function readReportsForDailyNumbers(storageKey) {
    try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
        return Array.isArray(saved) ? saved : [];
    } catch (error) { return []; }
}

function getUniqueDailyPermutations(digits) {
    const counts = {};
    for (const digit of digits) counts[digit] = (counts[digit] || 0) + 1;
    const result = [];
    function build(prefix) {
        if (prefix.length === digits.length) { result.push(prefix); return; }
        Object.keys(counts).sort().forEach(function(digit) {
            if (!counts[digit]) return;
            counts[digit]--;
            build(prefix + digit);
            counts[digit]++;
        });
    }
    build("");
    return result;
}


function getDailyNumbersFromBetLine(rawLine) {
    let line = String(rawLine || "").trim();
    if (!line || line.startsWith("#")) return [];

    let base = line;
    while (/(?:#{1,2}\d+|-\d+)$/.test(base)) {
        base = base.replace(/(?:#{1,2}\d+|-\d+)$/, "");
    }

    const boxMatch = base.match(/^(\*{1,2})(\d+)$/);
    if (boxMatch) return getUniqueDailyPermutations(boxMatch[2]);

    const prefixBoxMatch = base.match(/^(\d+)\*(\d+)$/);
    if (prefixBoxMatch) {
        return getUniqueDailyPermutations(prefixBoxMatch[2]).map(function(permutation) {
            return prefixBoxMatch[1] + permutation;
        });
    }

    const digits = base.replace(/\D/g, "");
    return digits.length >= 4 ? [digits.slice(0, 4)] : [];
}


async function copyDailyNumberTotal() {
    if (!dailyNumbersForCopy.length) {
        alert("没有可复制的号码。");
        return;
    }

    const text = dailyNumbersForCopy.join("\n");
    try {
        if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error("Clipboard API unavailable");
        await navigator.clipboard.writeText(text);
        alert(`已复制 ${dailyNumbersForCopy.length} 个不同号码。`);
    }
    catch (error) {
        const helper = document.createElement("textarea");
        helper.value = text;
        helper.setAttribute("readonly", "");
        helper.style.position = "fixed";
        helper.style.top = "0";
        helper.style.left = "0";
        helper.style.opacity = "0";
        document.body.appendChild(helper);
        helper.select();
        const copied = document.execCommand("copy");
        helper.remove();
        alert(copied ? `已复制 ${dailyNumbersForCopy.length} 个不同号码。` : "复制失败，请长按号码进行复制。");
    }
}

function renderDailyNumbers() {
    const selectedDate = normalizeDateString(dailyNumberDate.value);
    const groupOrder = ["M", "P", "T", "S", "I", "J", "W", "C", "N", "A", "H", "E"];
    const groups = Object.fromEntries(groupOrder.map(code => [code, []]));
    const totalNumbers = new Set();
    const receiptTotals = {hlb8: 0, haolong: 0};
    const receiptCounts = {hlb8: 0, haolong: 0};
    const amountByLottery = Object.fromEntries(groupOrder.map(code => [code, new Map()]));
    const uniquePermutations = function(value) {
        const results = new Set();
        const build = function(prefix, remaining) {
            if (!remaining.length) { results.add(prefix); return; }
            for (let i = 0; i < remaining.length; i++) {
                if (i > 0 && remaining[i] === remaining[i - 1]) continue;
                build(prefix + remaining[i], remaining.slice(0, i) + remaining.slice(i + 1));
            }
        };
        build("", value.split("").sort().join(""));
        return [...results];
    };
    const allSources = [
        {key: "hlb8_reports", product: "hlb8"},
        {key: "haolong_reports", product: "haolong"}
    ];
    const sources = dailyNumberProductFilter === "hlb8"
        ? allSources.filter(source => source.product === "hlb8")
        : dailyNumberProductFilter === "haolong-total"
            ? allSources.filter(source => source.product === "haolong")
            : allSources;

    if (!selectedDate) {
        dailyNumbersForCopy = [];
        dailyNumberResults.innerHTML = "";
        return;
    }

    sources.forEach(function(source) {
        const map = source.product === "haolong"
            ? {...numberMap, "8": "H", "9": "E"}
            : numberMap;

        readReportsForDailyNumbers(source.key).forEach(function(ticket) {
            if (ticket.cancelled || getReportCreationDate(ticket.createdAt) !== selectedDate) return;
            receiptCounts[source.product]++;

            const reportText = String(ticket.report || "");
            const amountMatch = source.product === "haolong"
                ? reportText.match(/^GT=([\d.]+)\(MYR\)$/m)
                : reportText.match(/^Total\(([\d.]+)\)OK$/m);
            if (amountMatch) receiptTotals[source.product] += Number(amountMatch[1]) || 0;

            // 按收据里的彩种标题，把各号码的单注金额分到对应彩种。
            let reportCodes = [...new Set(String(ticket.headerNumbers || "").split("").map(digit => map[digit]).filter(Boolean))];
            reportText.split(/\r?\n/).forEach(function(reportLine) {
                const line = reportLine.trim();
                const header = line.match(/^\*?([A-Z]{1,12})(?:\s+-X)?$/);
                if (header) {
                    const parsedCodes = [...new Set(header[1].split("").filter(code => groupOrder.includes(code)))];
                    if (parsedCodes.length) reportCodes = parsedCodes;
                    return;
                }
                const numberMatch = line.match(/^(?:\*{0,2})?(?:\(IB\))?(?:\[(\d{4})\]|\{(\d{4})\}|\((\d{4})\)|((?:\d{4})\*{0,2})|\d\((\d{3})\))=/);
                if (!numberMatch || !reportCodes.length) return;
                const number = numberMatch.slice(1).find(Boolean).replace(/\*/g, "");
                const betItems = [...line.matchAll(/\b(SA|SB|SC|SD|SE|B|S)(\d+(?:\.\d+)?)/g)]
                    .map(match => ({type: match[1], amount: Number(match[2]) || 0}));
                if (!betItems.length) return;
                const packMatch = line.match(/(?:i\s*box|ibox|iB|box)\s*x?\s*(\d+)/i);
                const packSize = packMatch ? Math.max(1, Number(packMatch[1]) || 1) : 1;
                const expandedNumbers = packMatch && /^\d{4}$/.test(number)
                    ? uniquePermutations(number).slice(0, packSize)
                    : [number];
                reportCodes.forEach(code => {
                    expandedNumbers.forEach(expandedNumber => {
                        if (!amountByLottery[code].has(expandedNumber)) {
                            amountByLottery[code].set(expandedNumber, {B: 0, S: 0, SA: 0, SB: 0, SC: 0, SD: 0, SE: 0});
                        }
                        const totals = amountByLottery[code].get(expandedNumber);
                        betItems.forEach(item => { totals[item.type] += item.amount / packSize; });
                    });
                });
            });

            let activeCodes = [...new Set(String(ticket.headerNumbers || "").split("").map(digit => map[digit]).filter(Boolean))];
            if (!activeCodes.length && reportText) {
                const header = reportText.split(/\r?\n/).find(line => /^\*?[A-Z]+$/.test(line.trim()) || /^[A-Z]+\s+-X$/.test(line.trim()));
                if (header) activeCodes = [...new Set(header.trim().replace(/^\*/, "").replace(/\s+-X$/, "").split(""))];
            }

            const rawLines = String(ticket.rawInput || "").split(/\r?\n/).slice(1);
            rawLines.forEach(function(rawLine) {
                const line = rawLine.trim();
                if (!line) return;
                const selection = line.match(/^#(\d+?)(?:(?:##?|-)(\d+))?$/);
                if (selection) {
                    activeCodes = [...new Set(selection[1].split("").map(digit => map[digit]).filter(Boolean))];
                    return;
                }
                const numbers = getDailyNumbersFromBetLine(line);
                if (!numbers.length) return;
                numbers.forEach(number => totalNumbers.add(number));
                activeCodes.forEach(code => {
                    if (groups[code]) groups[code].push(...numbers);
                });
            });
        });
    });

    dailyNumberResults.innerHTML = "";
    dailyNumbersForCopy = [...totalNumbers].sort();
    const copyButton = document.getElementById("dailyNumberCopyButton");
    if (copyButton) copyButton.disabled = dailyNumbersForCopy.length === 0;
    let hasResults = false;

    if (dailyNumberProductFilter === "amount-total") {
        groupOrder.forEach(function(code) {
            const entries = [...amountByLottery[code].entries()].sort((a, b) => {
                const totalA = Object.values(a[1]).reduce((sum, value) => sum + value, 0);
                const totalB = Object.values(b[1]).reduce((sum, value) => sum + value, 0);
                return totalB - totalA || a[0].localeCompare(b[0]);
            });
            if (!entries.length) return;
            hasResults = true;
            const section = document.createElement("section");
            section.className = "daily-number-group daily-number-total";
            const codeAmountTotal = entries.reduce((sum, [, amounts]) => sum + Object.values(amounts).reduce((rowSum, value) => rowSum + value, 0), 0);
            const formattedCodeTotal = (Math.round((codeAmountTotal + Number.EPSILON) * 1000) / 1000).toFixed(3).replace(/\.?0+$/, "");
            const title = document.createElement("div");
            title.className = "daily-number-group-title amount-ticket-title";
            title.textContent = `${code}票单合计：${formattedCodeTotal} MYR`;
            section.appendChild(title);

            const types = ["B", "S", "SA", "SB", "SC", "SD", "SE"];
            const typeHeader = document.createElement("div");
            typeHeader.className = "amount-type-grid amount-type-header";
            types.forEach(type => {
                const cell = document.createElement("span");
                cell.textContent = type;
                typeHeader.appendChild(cell);
            });
            section.appendChild(typeHeader);

            entries.forEach(function([number, amounts]) {
                const row = document.createElement("div");
                row.className = "daily-number-line amount-number-row";
                const numberLabel = document.createElement("strong");
                numberLabel.textContent = number;
                const values = document.createElement("div");
                values.className = "amount-type-grid amount-type-values";
                types.forEach(function(type) {
                    const cell = document.createElement("span");
                    const amount = amounts[type];
                    if (amount) {
                        const roundedAmount = (Math.round((amount + Number.EPSILON) * 1000) / 1000).toFixed(3).replace(/\.?0+$/, "");
                        cell.textContent = `RM${roundedAmount}`;
                        if (amount > 5) cell.classList.add("amount-over-five");
                    } else {
                        cell.textContent = "";
                        cell.style.border = "0";
                        cell.style.background = "transparent";
                    }
                    values.appendChild(cell);
                });
                row.append(numberLabel, values);
                section.appendChild(row);
            });
            dailyNumberResults.appendChild(section);
        });
        if (!hasResults) {
            const empty = document.createElement("div");
            empty.className = "daily-number-empty";
            empty.textContent = "这一天没有找到有效票单";
            dailyNumberResults.appendChild(empty);
        }
        return;
    }

    if (dailyNumberProductFilter === "hlb8") {
        const summarySection = document.createElement("section");
        summarySection.className = "daily-number-group daily-number-total";
        const summaryTitle = document.createElement("div");
        summaryTitle.className = "daily-number-group-title";
        summaryTitle.textContent = "新单合计";
        summarySection.appendChild(summaryTitle);
        const summaryLine = document.createElement("div");
        summaryLine.className = "daily-number-line daily-number-summary";
        summaryLine.textContent = `新单票单合计：${receiptTotals.hlb8}`;
        summarySection.appendChild(summaryLine);
        dailyNumberResults.appendChild(summarySection);
    }

    if (totalNumbers.size) {
        hasResults = true;
        const section = document.createElement("section");
        section.className = "daily-number-group daily-number-total";
        const title = document.createElement("div");
        title.className = "daily-number-group-title";
        title.textContent = `TOTAL（${totalNumbers.size}个不同号码）`;
        section.appendChild(title);
        const summary = document.createElement("div");
        summary.className = "daily-number-line daily-number-summary";
        summary.textContent = dailyNumberProductFilter === "haolong-total"
            ? `豪龙合计：${receiptTotals.haolong} MYR`
            : `新单票单合计：${receiptTotals.hlb8}；豪龙合计：${receiptTotals.haolong} MYR`;
        if (dailyNumberProductFilter !== "hlb8") section.appendChild(summary);
        [...totalNumbers].sort().forEach(function(number) {
            const row = document.createElement("div");
            row.className = "daily-number-line";
            row.textContent = number;
            section.appendChild(row);
        });
        dailyNumberResults.appendChild(section);
    }

    if (dailyNumberProductFilter !== "hlb8-total" && dailyNumberProductFilter !== "haolong-total") {
        groupOrder.forEach(function(code) {
            if (!groups[code].length) return;
            hasResults = true;
            const section = document.createElement("section");
            section.className = "daily-number-group";
            const title = document.createElement("div");
            title.className = "daily-number-group-title";
            title.textContent = `${code}（${groups[code].length}）`;
            section.appendChild(title);
            groups[code].forEach(function(number) {
                const row = document.createElement("div");
                row.className = "daily-number-line";
                row.textContent = number;
                section.appendChild(row);
            });
            dailyNumberResults.appendChild(section);
        });
    }

    if (!hasResults) {
        const empty = document.createElement("div");
        empty.className = "daily-number-empty";
        empty.textContent = "这一天没有找到已买号码";
        dailyNumberResults.appendChild(empty);
    }
}

dateInput.addEventListener(

function updateActiveLineHighlight() {

    const input = numberInput;

    const style =
        window.getComputedStyle(input);

    const lineHeight =
        parseFloat(style.lineHeight) ||
        parseFloat(style.fontSize) * 1.65;

    const paddingTop =
        parseFloat(style.paddingTop) || 0;

    const beforeCaret =
        input.value.substring(
            0,
            input.selectionStart || 0
        );

    const lineIndex =
        (beforeCaret.match(/\n/g) || []).length;

    const lineTop =
        paddingTop +
        lineIndex * lineHeight -
        input.scrollTop;

    const lineBottom =
        lineTop + lineHeight;

    if (lineBottom <= 0 || lineTop >= input.clientHeight) {

        input.style.backgroundImage = "none";

        return;

    }

    const visibleTop = Math.max(0, lineTop);
    const visibleBottom = Math.min(input.clientHeight, lineBottom);

    input.style.backgroundImage =
        `linear-gradient(to bottom, transparent 0px, transparent ${visibleTop}px, #f9ead7 ${visibleTop}px, #f9ead7 ${visibleBottom}px, transparent ${visibleBottom}px)`;

}


numberInput.addEventListener(
    "focus",
    function() {

        activeInput =
            numberInput;
        preferNumberInput = true;

        updateActiveLineHighlight();

    }
);


numberInput.addEventListener(
    "scroll",
    updateActiveLineHighlight
);

// 手机点按时按触点定位行；停在该行末尾，方便继续输入或按删除键。
function selectNumberLineAtPoint(clientY) {
    const style = window.getComputedStyle(numberInput);
    const lineHeight = parseFloat(style.lineHeight) || parseFloat(style.fontSize) * 1.65;
    const paddingTop = parseFloat(style.paddingTop) || 0;
    const rect = numberInput.getBoundingClientRect();
    const yInText = clientY - rect.top - paddingTop + numberInput.scrollTop;
    const targetLine = Math.max(0, Math.floor(yInText / lineHeight));
    const lineStarts = [0];
    for (let i = 0; i < numberInput.value.length; i++) {
        if (numberInput.value[i] === "\n") lineStarts.push(i + 1);
    }
    while (lineStarts.length <= targetLine) {
        numberInput.value += "\n";
        lineStarts.push(numberInput.value.length);
    }
    const lineStart = lineStarts[targetLine];
    const nextBreak = numberInput.value.indexOf("\n", lineStart);
    const cursor = nextBreak < 0 ? numberInput.value.length : nextBreak;
    numberInput.focus();
    numberInput.setSelectionRange(cursor, cursor);
    activeInput = numberInput;
    preferNumberInput = true;
    updateActiveLineHighlight();
}

numberInput.addEventListener("pointerdown", function(event) {
    event.preventDefault();
    selectNumberLineAtPoint(event.clientY);
});


/* =====================================================
   键盘输入
===================================================== */

function inputKey(char) {

    if (!activeInput) {

        activeInput =
            dateInput;

    }


    const targetInput = preferNumberInput ? numberInput : activeInput;
    const start = targetInput.selectionStart;
    const end = targetInput.selectionEnd;
    const value = targetInput.value;

    targetInput.value =
        value.substring(0, start) +
        char +
        value.substring(end);

    const position = start + char.length;
    targetInput.focus();
    targetInput.setSelectionRange(position, position);
    activeInput = targetInput;

    if (targetInput === numberInput) {

        updateActiveLineHighlight();

    }

    updateAmount();

}


/* =====================================================
   ENTER
===================================================== */

function enterKey() {

    activeInput =
        numberInput;


    const start =
        numberInput.selectionStart;


    const end =
        numberInput.selectionEnd;


    const value =
        numberInput.value;


    numberInput.value =
        value.substring(0, start) +
        "\n" +
        value.substring(end);


    const position =
        start + 1;


    numberInput.focus();


    numberInput.setSelectionRange(
        position,
        position
    );

    updateActiveLineHighlight();

    updateAmount();

}


/* =====================================================
   Backspace
===================================================== */

function backspace() {

    if (!activeInput) {

        activeInput =
            dateInput;

    }


    const start =
        activeInput.selectionStart;


    const end =
        activeInput.selectionEnd;


    const value =
        activeInput.value;


    if (start !== end) {

        activeInput.value =
            value.substring(0, start) +
            value.substring(end);


        activeInput.focus();


        activeInput.setSelectionRange(
            start,
            start
        );

        if (activeInput === numberInput) {

            updateActiveLineHighlight();

        }

        updateAmount();

        return;

    }


    if (start <= 0) {

        return;

    }


    activeInput.value =
        value.substring(0, start - 1) +
        value.substring(start);


    activeInput.focus();


    activeInput.setSelectionRange(
        start - 1,
        start - 1
    );

    if (activeInput === numberInput) {

        updateActiveLineHighlight();

    }

    updateAmount();

}

/* =====================================================
   阶乘
===================================================== */

function factorial(n) {

    let result = 1;


    for (
        let i = 2;
        i <= n;
        i++
    ) {

        result *= i;

    }


    return result;

}


/* =====================================================
   包字排列数量
===================================================== */

function getPermutationCount(
    numberString
) {

    const counts = {};


    for (
        const char of numberString
    ) {

        counts[char] =
            (counts[char] || 0) + 1;

    }


    let denominator = 1;


    Object.values(counts).forEach(
        function(count) {

            denominator *=
                factorial(count);

        }
    );


    return (
        factorial(numberString.length) /
        denominator
    );

}


/* =====================================================
   数字 → MTW
===================================================== */

function convertToLetters(
    numbers
) {

    let result = "";

    const productNumberMap =
        activeProduct === "haolong"
            ? { ...numberMap, "8": "H", "9": "E" }
            : numberMap;


    for (
        const char of numbers
    ) {

        if (productNumberMap[char]) {

            result +=
                productNumberMap[char];

        }

    }


    return result;

}


/* =====================================================
   日期指令
===================================================== */

function parseDateCommand(value) {

    const text =
        value
            .trim()
            .toUpperCase();


    if (text === "D") {

        return {

            type: "period",

            count: 1

        };

    }


    if (text === "D#") {

        return {

            type: "period",

            count: 1

        };

    }


    const periodMatch =
        text.match(
            /^D(\d+)$/
        );


    if (periodMatch) {

        const count =
            parseInt(
                periodMatch[1],
                10
            );


        if (count < 1) {

            return null;

        }


        return {

            type: "period",

            count: count

        };

    }


    const hashMatch =
        text.match(
            /^D#(\d{1,2})$/
        );


    if (hashMatch) {

        const digits =
            hashMatch[1];


        if (
            digits.length === 1
        ) {

            const count =
                parseInt(
                    digits,
                    10
                );


            if (count < 1) {

                return null;

            }


            return {

                type: "period",

                count: count

            };

        }


        const day =
            parseInt(
                digits,
                10
            );


        if (
            day < 1 ||
            day > 31
        ) {

            return null;

        }


        return {

            type: "date",

            day: day

        };

    }


    return null;

}


/* =====================================================
   Magnum 日期
===================================================== */

const MAGNUM_DAYS = [
    0,
    3,
    6
];


function isMagnumDate(date) {

    return MAGNUM_DAYS.includes(
        date.getDay()
    );

}


/* =====================================================
   找最近一期
===================================================== */

function getNextMagnumDate(
    fromDate
) {

    const start =
        new Date(fromDate);


    start.setHours(
        0,
        0,
        0,
        0
    );


    for (
        let i = 0;
        i <= 7;
        i++
    ) {

        const date =
            new Date(start);


        date.setDate(
            start.getDate() + i
        );


        if (
            isMagnumDate(date)
        ) {

            return date;

        }

    }


    return null;

}


/* =====================================================
   找 N 期
===================================================== */

function getMagnumDates(
    count
) {

    const result = [];


    let current =
        new Date();


    current.setHours(
        0,
        0,
        0,
        0
    );


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const date =
            getNextMagnumDate(
                current
            );


        if (!date) {

            break;

        }


        result.push(date);


        current =
            new Date(date);


        current.setDate(
            current.getDate() + 1
        );

    }


    return result;

}


/* =====================================================
   指定日期
===================================================== */

function getSpecificDate(
    day
) {

    const now =
        new Date();


    now.setHours(
        0,
        0,
        0,
        0
    );


    let year =
        now.getFullYear();


    let month =
        now.getMonth();


    let date =
        new Date(
            year,
            month,
            day
        );


    if (
        date.getDate() !== day
    ) {

        month++;


        date =
            new Date(
                year,
                month,
                day
            );

    }


    if (
        date < now
    ) {

        month++;


        date =
            new Date(
                year,
                month,
                day
            );

    }


    if (
        date.getDate() !== day
    ) {

        return null;

    }


    return date;

}


/* =====================================================
   根据 D 指令取得日期
===================================================== */

function getDrawDates(
    dateCommand
) {

    const parsed =
        parseDateCommand(
            dateCommand
        );


    if (!parsed) {

        return null;

    }


    if (
        parsed.type === "period"
    ) {

        return getMagnumDates(
            parsed.count
        );

    }


    if (
        parsed.type === "date"
    ) {

        const date =
            getSpecificDate(
                parsed.day
            );


        if (!date) {

            return null;

        }


        return [date];

    }


    return null;

}


/* =====================================================
   日期格式
===================================================== */

function formatShortDate(

) {

    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    const month =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    return `${day}/${month}`;

}


function formatDrawDates(
    dates
) {

    if (
        !dates ||
        dates.length === 0
    ) {

        return "";

    }


    if (
        dates.length === 1
    ) {

        return formatShortDate(
            dates[0]
        );

    }


    return (
        formatShortDate(dates[0]) +
        "~" +
        formatShortDate(
            dates[dates.length - 1]
        )
    );

}

/* =====================================================
   解析普通号码
===================================================== */

function parseBasicLine(
    line
) {

    line =
        line.trim();


    const convertToMtw =
        line.startsWith("#");


    if (convertToMtw) {

        line =
            line.substring(1).trim();

    }


    if (activeProduct === "haolong") {

        const dualModeMatch =
            line.match(
                /^(.+?)#(\d+)#(\d+)$/
            );

        if (dualModeMatch) {

            const bigQuantity =
                parseInt(dualModeMatch[2], 10);

            const smallQuantity =
                parseInt(dualModeMatch[3], 10);

            return {

                number:
                    dualModeMatch[1].trim(),

                quantity:
                    bigQuantity + smallQuantity,

                bigQuantity:
                    bigQuantity,

                smallQuantity:
                    smallQuantity,

                multiMode: true,

                mode: "big",

                hasQuantity: true,

                convertToMtw: convertToMtw

            };

        }

    }


    let match =
        line.match(
            /^(.+?)##(\d+)$/
        );


    if (match) {

        return {

            number:
                match[1].trim(),

            quantity:
                parseInt(
                    match[2],
                    10
                ),

            mode: "small",

            hasQuantity: true,

            convertToMtw: convertToMtw

        };

    }


    match =
        line.match(
            /^(.+?)#(\d+)$/
        );


    if (match) {

        return {

            number:
                match[1].trim(),

            quantity:
                parseInt(
                    match[2],
                    10
                ),

            mode: "big",

            hasQuantity: true,

            convertToMtw: convertToMtw

        };

    }


    match =
        line.match(
            /^(.+?)-(\d+)$/
        );


    if (match) {

        return {

            number:
                match[1].trim(),

            quantity:
                parseInt(
                    match[2],
                    10
                ),

            mode: "big",

            hasQuantity: true,

            convertToMtw: convertToMtw

        };

    }


    return {

        number: line,

        quantity: null,

        mode: "big",

        hasQuantity: false,

        convertToMtw: convertToMtw

    };

}


/* =====================================================
   分析号码
===================================================== */

function analyzeNumber(
    text
) {

    text =
        text.trim();


    if (
        text.endsWith("**")
    ) {

        let prefix = "";

        let number = text;


        if (
            number.startsWith("**")
        ) {

            prefix = "**";

            number =
                number.substring(2);

        }
        else if (
            number.startsWith("*")
        ) {

            prefix = "*";

            number =
                number.substring(1);

        }


        number =
            number.substring(
                0,
                number.length - 2
            );


        return {

            type: "starSpecial",

            prefix: prefix,

            number: number

        };

    }


    if (
        text.startsWith("**")
    ) {

        return {

            type: "iBao",

            number:
                text.substring(2)

        };

    }


    if (
        text.startsWith("*")
    ) {

        return {

            type: "bao",

            number:
                text.substring(1)

        };

    }


    const middle =
        text.match(
            /^(\d+)\*(\d+)$/
        );


    if (middle) {

        return {

            type: "prefixBao",

            prefixNumber:
                middle[1],

            number:
                middle[2]

        };

    }


    return {

        type: "normal",

        number: text

    };

}


/* =====================================================
   数字检查
===================================================== */

function isValidNumber(
    number
) {

    return /^[0-9]+$/.test(
        number
    );

}


/* =====================================================
   ** 特殊下注
===================================================== */

function parseStarQuantities(
    text
) {

    const matches =
        text.match(
            /#(\d+)/g
        );


    if (!matches) {

        return [];

    }


    return matches.map(
        function(item) {

            return parseInt(
                item.substring(1),
                10
            );

        }
    );

}

   普通

function formatNormal(

   1*234

/* =====================================================
   **1234**
===================================================== */

function formatStarSpecial(
    analyzed,
    quantities
) {

    const labels = [
        "SA",
        "SB",
        "SC",
        "SD",
        "SE"
    ];


    let result =
        `${analyzed.prefix}${analyzed.number}**=`;


    let parts = [];


    for (
        let i = 0;
        i < quantities.length &&
        i < labels.length;
        i++
    ) {

        const quantity =
            quantities[i];


        if (
            quantity > 0
        ) {

            parts.push(
                `-${labels[i]}${quantity}`
            );

        }

    }


    return (
        result +
        parts.join("")
    );

}


/* =====================================================
   单项 Total
===================================================== */

function calculateItemTotal(
    headerMultiplier,
    item
) {

    if (
        item.isMtwControl
    ) {

        return 0;

    }


    const multiplier =
        item.sideMultiplier ||
        headerMultiplier;


    if (
        item.special
    ) {

        let sum = 0;


        item.quantities.forEach(
            function(quantity) {

                if (
                    quantity > 0
                ) {

                    sum += quantity;

                }

            }
        );


        return (
            multiplier *
            sum
        );

    }


    const analyzed =
        item.analyzed;


    const quantity =
        item.quantity;


    if (
        analyzed.type ===
        "normal"
    ) {

        return (
            multiplier *
            quantity
        );

    }


    if (
        analyzed.type ===
        "bao"
    ) {

        return (
            multiplier *
            quantity *
            getPermutationCount(
                analyzed.number
            )
        );

    }


    if (
        analyzed.type ===
        "iBao"
    ) {

        // ** / ibox is priced once for the selected stake; permutation
        // count is informational and must not multiply the charge.
        return (
            multiplier *
            quantity
        );

    }


    if (
        analyzed.type ===
        "prefixBao"
    ) {

        return (
            multiplier *
            quantity *
            getPermutationCount(
                analyzed.number
            )
        );

    }


    return 0;

}


/* =====================================================
   解析号码行
===================================================== */

function parseNumberLines(
    rawLines,
    headerMultiplier = 1
) {

    const result = [];


    let previousQuantity =
        null;

    let previousSpecialQuantities =
        null;

    let activeMultiplier =
        headerMultiplier;


    for (
        const rawLine
        of rawLines
    ) {


        /* 特殊 */

        const firstHash =
            rawLine.indexOf("#");

        const numberPart =
            firstHash >= 0
                ? rawLine.substring(0, firstHash).trim()
                : rawLine.trim();

        if (
            rawLine.includes("**") &&
            numberPart.endsWith("**")
        ) {

            const quantityPart =
                firstHash >= 0
                    ? rawLine.substring(firstHash)
                    : "";


            const analyzed =
                analyzeNumber(
                    numberPart
                );


            if (
                analyzed.type !==
                "starSpecial"
            ) {

                return {

                    error:
                        `特殊格式不正确：\n${rawLine}`

                };

            }


            if (
                !isValidNumber(
                    analyzed.number
                )
            ) {

                return {

                    error:
                        `号码格式不正确：\n${rawLine}`

                };

            }


            const quantities =
                quantityPart
                    ? parseStarQuantities(quantityPart)
                    : previousSpecialQuantities
                        ? [...previousSpecialQuantities]
                        : [];

            if (!quantities.length) {
                return {
                    error:
                        `特殊下注数量请先输入，例如：\n1234**#1#1#1\n1434**`
                };
            }

            previousSpecialQuantities =
                [...quantities];


            result.push({

                special: true,

                analyzed:
                    analyzed,

                quantities:
                    quantities,

                sideMultiplier:
                    activeMultiplier

            });


            continue;

        }


        /* 普通 */

        const info =
            parseBasicLine(
                rawLine
            );


        if (
            info.convertToMtw
        ) {

            const controlAnalyzed =
                analyzeNumber(info.number);

            if (
                !isValidNumber(controlAnalyzed.number)
            ) {

                return {

                    error:
                        `号码格式不正确：\n${rawLine}`

                };

            }

            activeMultiplier =
                controlAnalyzed.number.length;

            result.push({

                special: false,

                analyzed:
                    controlAnalyzed,

                quantity: 0,

                mode:
                    info.mode,

                convertToMtw: true,

                isMtwControl: true,

                sideMultiplier:
                    activeMultiplier

            });

            continue;

        }


        if (
            info.multiMode
        ) {

            previousQuantity =
                info.quantity;

        }
        else if (
            !info.hasQuantity
        ) {

            if (
                previousQuantity === null
            ) {

                return {

                    error:
                        `第一组号码必须先输入数量，例如：1234#1`

                };

            }


            info.quantity =
                previousQuantity;

        }
        else {

            previousQuantity =
                info.quantity;

        }


        if (
            !info.quantity ||
            info.quantity <= 0
        ) {

            return {

                error:
                    `数量必须大于 0：\n${rawLine}`

            };

        }


        const analyzed =
            analyzeNumber(
                info.number
            );


        if (
            !isValidNumber(
                analyzed.number
            )
        ) {

            return {

                error:
                    `号码格式不正确：\n${rawLine}`

            };

        }


        result.push({

            special: false,

            analyzed:
                analyzed,

            quantity:
                info.quantity,

            mode:
                info.mode,

            convertToMtw:
                info.convertToMtw,

            multiMode:
                info.multiMode || false,

            bigQuantity:
                info.bigQuantity,

            smallQuantity:
                info.smallQuantity,

            sideMultiplier:
                activeMultiplier

        });

    }


    return {

        data: result

    };

}


function getHaolongDateStamp(date = new Date()) {

    const year =
        String(date.getFullYear());

    const month =
        String(date.getMonth() + 1).padStart(2, "0");

    const day =
        String(date.getDate()).padStart(2, "0");

    return `${year}${month}${day}`;

}


function formatHaolongReceiptTime(date = new Date()) {

    const year =
        String(date.getFullYear()).slice(-2);

    const month =
        String(date.getMonth() + 1).padStart(2, "0");

    const day =
        String(date.getDate()).padStart(2, "0");

    const hour =
        String(date.getHours()).padStart(2, "0");

    const minute =
        String(date.getMinutes()).padStart(2, "0");

    return `${year}${month}${day} ${hour}${minute}`;

}


function formatHaolongItem(item, analyzed) {

    if (item.convertToMtw) {

        return analyzed.number;

    }

    if (item.special) {

        const labels = ["SA", "SB", "SC", "SD", "SE"];

        const parts = item.quantities
            .slice(0, labels.length)
            .map((quantity, index) =>
                quantity > 0 ? `${labels[index]}${quantity}` : ""
            )
            .filter(Boolean);

        const isIBox = analyzed.prefix === "**";
        const numberPrefix = isIBox ? "(IB)" : "";
        const iboxSuffix = isIBox
            ? `(ibox${getPermutationCount(analyzed.number)})`
            : "";

        return `${numberPrefix}${analyzed.number}=${parts.join(" ")}${iboxSuffix}`;

    }

    if (item.multiMode) {

        return `${analyzed.number}=B${item.bigQuantity} S${item.smallQuantity}`;

    }

    if (analyzed.type === "normal") {

        const mode = item.mode === "small" ? "S" : "B";

        return `${analyzed.number}=${mode}${item.quantity}`;

    }

    if (analyzed.type === "bao") {

        return `(${analyzed.number})=B${item.quantity}(box${getPermutationCount(analyzed.number)})`;

    }

    if (analyzed.type === "iBao") {

        const mode = item.mode === "small" ? "S" : "B";

        return `(IB)${analyzed.number}=${mode}${item.quantity}(ibox${getPermutationCount(analyzed.number)})`;

    }

    if (analyzed.type === "prefixBao") {

        return `${analyzed.prefixNumber}(${analyzed.number})=B${item.quantity}(box${getPermutationCount(analyzed.number)})`;

    }

    return "";

}

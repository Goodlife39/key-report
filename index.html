/* =====================================================
   Generate Report
===================================================== */

function generateReport() {

    const receiptProduct = activeProduct;

    const dateCommand =
        dateInput.value.trim();


    const input =
        numberInput.value.trim();


    if (!dateCommand) {

        alert(
            "请输入日期，例如 D、D#、D2、D#2 或 D#02。"
        );

        dateInput.focus();

        return;

    }


    if (!input) {

        alert(
            "请输入号码。"
        );

        numberInput.focus();

        return;

    }


    const lines =
        input
            .split(/\r?\n/)
            .map(
                line =>
                    line.trim()
            )
            .filter(
                line =>
                    line !== ""
            );


    if (
        lines.length < 2
    ) {

        alert(
            "请输入号码组和下注号码。\n例如：\n137\n1234#1"
        );

        return;

    }


    let headerNumbers =
        lines[0];


    if (
        headerNumbers.startsWith("#")
    ) {

        headerNumbers =
            headerNumbers
                .substring(1)
                .trim();

    }


    if (
        !/^[0-9]+$/.test(
            headerNumbers
        )
    ) {

        alert(
            "第一行只能输入数字，例如 137 或 #137。"
        );

        return;

    }


    if (
        headerNumbers.length === 0
    ) {

        alert(
            "第一行号码不能为空。"
        );

        return;

    }


    /* 日期 */

    const drawDates =
        getDrawDates(
            dateCommand
        );


    if (
        !drawDates ||
        drawDates.length === 0
    ) {

        alert(
            "日期格式不正确。"
        );

        return;

    }


    /* MTW */

    const mtw =
        convertToLetters(
            headerNumbers
        );


    const headerMultiplier =
        headerNumbers.length;


    /* 下注 */

    const numberLines =
        lines.slice(1);


    const parsed =
        parseNumberLines(
            numberLines,
            headerMultiplier
        );


    if (
        parsed.error
    ) {

        alert(
            parsed.error
        );

        return;

    }


    const items =
        parsed.data;


    /* Total */

    let onePeriodTotal = 0;


    items.forEach(
        function(item) {

            onePeriodTotal +=
                calculateItemTotal(
                    headerMultiplier,
                    item
                );

        }
    );


    const total =
        onePeriodTotal *
        drawDates.length;


    /* Generate 编号 */

    const receiptCreatedAt =
        new Date();

    const receiptDateStamp =
        getHaolongDateStamp(receiptCreatedAt);

    const counterStorageKey =
        getCounterStorageKey(receiptDateStamp);

    generateCount =
        parseInt(
            localStorage.getItem(counterStorageKey),
            10
        ) || 0;

    generateCount++;


    localStorage.setItem(
        counterStorageKey,
        generateCount
    );


    const count =
        String(generateCount);

    const reportId =
        receiptProduct === "haolong"
            ? `haolong-${receiptDateStamp}-${count}`
            : generateCount;


    /* Report */

    let report = "";


    if (receiptProduct === "haolong") {

        report +=
            `${formatHaolongReceiptTime(receiptCreatedAt)}(${count})\n`;

        report +=
            "GX999\n";

        report +=
            `${formatDrawDates(drawDates)}\n`;

        report +=
            `*${mtw}\n`;

        items.forEach(
            function(item) {

                const analyzed =
                    item.convertToMtw
                        ? {
                            ...item.analyzed,
                            number: convertToLetters(item.analyzed.number),
                            prefixNumber: item.analyzed.prefixNumber
                                ? convertToLetters(item.analyzed.prefixNumber)
                                : item.analyzed.prefixNumber
                        }
                        : item.analyzed;

                report +=
                    formatHaolongItem(item, analyzed) +
                    "\n";

            }
        );

        report +=
            `GT=${total}(MYR)`;

    }
    else {



    report +=
        `D:${getCurrentDateTime()}\n`;


    report +=
        `COPY******\n`;


    report +=
        `${getProductLabel()} (${count})\n`;


    report +=
        `${formatDrawDates(drawDates)}\n`;


    report +=
        `${mtw} -X\n`;


    items.forEach(
        function(item) {

            const reportAnalyzed =
                item.convertToMtw
                    ? {
                        ...item.analyzed,
                        number: convertToLetters(item.analyzed.number),
                        prefixNumber: item.analyzed.prefixNumber
                            ? convertToLetters(item.analyzed.prefixNumber)
                            : item.analyzed.prefixNumber
                    }
                    : item.analyzed;


            if (
                item.convertToMtw
            ) {

                report +=
                    reportAnalyzed.number +
                    "\n";

                return;

            }


            if (
                item.special
            ) {

                report +=
                    formatStarSpecial(
                        item.analyzed,
                        item.quantities
                    ) +
                    "\n";

                return;

            }


            if (
                item.analyzed.type ===
                "normal"
            ) {

                report +=
                    formatNormal(
                        reportAnalyzed.number,
                        item.quantity,
                        item.mode
                    ) +
                    "\n";

                return;

            }


            if (
                item.analyzed.type ===
                "bao"
            ) {

                report +=
                    formatBao(
                        reportAnalyzed.number,
                        item.quantity
                    ) +
                    "\n";

                return;

            }


            if (
                item.analyzed.type ===
                "iBao"
            ) {

                report +=
                    formatIBao(
                        reportAnalyzed.number,
                        item.quantity
                    ) +
                    "\n";

                return;

            }


            if (
                item.analyzed.type ===
                "prefixBao"
            ) {

                report +=
                    formatPrefixBao(
                        reportAnalyzed.prefixNumber,
                        reportAnalyzed.number,
                        item.quantity
                    ) +
                    "\n";

            }

        }
    );


    report +=
        `Total(${total})OK\n`;


    report +=
        `END`;



    }


    /* =================================================
       保存完整资料
    ================================================= */

    const reports =
        getSavedReports();


    reports.unshift({

        id: reportId,

        product: receiptProduct,

        count: count,

        report: report,

        rawInput: input,

        dateCommand: dateCommand,

        headerNumbers: headerNumbers,

        createdAt:
            receiptCreatedAt.toISOString(),

        cancelled: false

    });


    saveReports(
        reports
    );


    numberInput.value = "";
    updateAmount();
    updateActiveLineHighlight();
    openReceiptModal(reportId, report, receiptProduct);

}

/* =====================================================
   删除 / 废票
   ===================================================== */

function formatDeletedTimestamp(value) {
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "";
    const pad = part => String(part).padStart(2, "0");
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
}

function cancelReport(
    reportId
) {

    const reports =
        getSavedReports();


    const item =
        reports.find(
            function(report) {

                return (
                    report.id ===
                    reportId
                );

            }
        );


    if (!item) {

        return;

    }

            if (item.cancelled) {
        item.cancelled = false;
        delete item.deletedAt;
    }
    else {
        item.cancelled = true;
        item.deletedAt = new Date().toISOString();
    }


    saveReports(
        reports
    );


    renderReports();

}


/* =====================================================
   Report 搜索
===================================================== */

function searchReports() {
    const boxValue = searchBoxNumber.value.trim();
    if (boxValue && boxValue.replace(/\D/g, "").length !== 4) {
        alert("包号码请输入4位数字。");
        searchBoxNumber.focus();
        return;
    }
    renderReports();
}


/* =====================================================
   搜索是否包含号码
===================================================== */

function reportContainsNumber(
    report,
    searchValue
) {

    if (!searchValue) {

        return true;

    }


    return (
        report.rawInput
            .replace(/\s/g, "")
            .includes(
                searchValue
                    .replace(/\s/g, "")
            )
    );

}


function reportContainsBoxNumber(report, value) {
    const digits = String(value || "").replace(/\D/g, "");
    if (digits.length !== 4) return false;

    const permutations = new Set(getUniqueDailyPermutations(digits));
    const rawLines = String(report.rawInput || "").split(/\r?\n/).slice(1);
    for (const line of rawLines) {
        const purchasedNumbers = getDailyNumbersFromBetLine(line);
        if (purchasedNumbers.some(number => permutations.has(number))) return true;
    }
    return false;
}

/* =====================================================
   Render Reports
===================================================== */

function renderReports() {

    const list =
        document.getElementById(
            "reportList"
        );


    const reports =
        getSavedReports();


    const dateValue =
        normalizeDateString(
            searchDate.value
        );


    const idValue =
        searchId.value
            .trim();


    const numberValue =
        searchNumber.value
            .trim();

    const boxNumberValue = searchBoxNumber.value.trim();

    let filtered =
        reports.filter(
            function(report) {


                /* 日期 */

                if (
                    dateValue
                ) {

                    const reportDate =
                        getReportCreationDate(
                            report.createdAt
                        );


                    if (
                        reportDate !==
                        dateValue
                    ) {

                        return false;

                    }

                }


                /* 编号 */

                if (
                    idValue
                ) {

                    const idText =
                        String(
                            report.id
                        );

                    const visibleCount =
                        report.count !== undefined && report.count !== null
                            ? String(report.count)
                            : "";

                    if (
                        idText !== idValue &&
                        visibleCount !== idValue
                    )
                    {

                        return false;

                    }

                }


                /* 包号码：按所有不同排列匹配 */
                if (boxNumberValue && !reportContainsBoxNumber(report, boxNumberValue)) {
                    return false;
                }

                /* 号码 */

                if (
                    numberValue
                ) {

                    if (
                        !reportContainsNumber(
                            report,
                            numberValue
                        )
                    ) {

                        return false;

                    }

                }


                return true;

            }
        );


    /* 最新在最上面 */

    filtered.sort(
        function(a, b) {

            return (
                new Date(b.createdAt) -
                new Date(a.createdAt)
            );

        }
    );


    list.innerHTML =
        "";


    if (
        filtered.length === 0
    ) {

        list.innerHTML =
            `
            <div class="no-result">
                没有找到 Report
            </div>
            `;

        return;

    }


    filtered.forEach(
        function(item) {

            const reportProduct = item.product || activeProduct;

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "report-card";


            
            if (reportProduct === "haolong") {
                card.classList.add("haolong-card");

                const title = document.createElement("div");
                title.className = "haolong-report-title";
                title.textContent = "下注";
                card.appendChild(title);
            }

            if (
                item.cancelled
            ) {

                card.classList.add(
                    "cancelled"
                );

            }


            /* =================================================
               废票显示
            ================================================= */

            if (item.cancelled && reportProduct !== "haolong") {

                const cancelLabel =
                    document.createElement(
                        "div"
                    );


                cancelLabel.className =
                    "cancel-label";


                cancelLabel.textContent =
                    "******";


                card.appendChild(
                    cancelLabel
                );


                const cancelText =
                    document.createElement(
                        "div"
                    );


                cancelText.textContent =
                    `COPY(CANCEL)[${item.id}]`;


                card.appendChild(
                    cancelText
                );

            }


            /* =================================================
               Report 内容
            ================================================= */

            const reportText =
                document.createElement(
                    "div"
                );


            
            if (reportProduct === "haolong") {
                reportText.className = "haolong-report-content";
            }

            if (reportProduct === "haolong") {
                let deletedLabelAdded = false;
                item.report.split("\n").forEach(function(line) {
                    const lineElement = document.createElement("div");
                    lineElement.className = "haolong-report-line";
                    if (item.cancelled && line.trim() === "RRRR") {
                        lineElement.classList.add("haolong-cancel-source-line");
                    }

                    if (line === "GX999" || line === "GXX999") {
                        const blueText = document.createElement("span");
                        blueText.className = "haolong-report-blue";
                        blueText.textContent = "GX999";
                        lineElement.appendChild(blueText);
                    }
                    else {
                        const totalMatch = line.match(/^GT=(.*)\(MYR\)$/);

                        if (totalMatch) {
                            lineElement.appendChild(document.createTextNode("GT="));

                            const blueAmount = document.createElement("span");
                            blueAmount.className = "haolong-report-blue";
                            blueAmount.textContent = totalMatch[1];
                            lineElement.appendChild(blueAmount);
                            lineElement.appendChild(document.createTextNode("(MYR)"));
                        }
                        else {
                            lineElement.textContent = line;
                        }
                    }

                    reportText.appendChild(lineElement);

                    if (item.cancelled && !deletedLabelAdded && (line === "GX999" || line === "GXX999")) {
                        const deletedLine = document.createElement("div");
                        deletedLine.className = "haolong-report-line haolong-deleted-at";
                        deletedLine.textContent = `DELETED${item.deletedAt ? ` ${formatDeletedTimestamp(item.deletedAt)}` : ""}`;
                        reportText.appendChild(deletedLine);
                        deletedLabelAdded = true;
                    }
                });

                if (item.cancelled && !deletedLabelAdded) {
                    const deletedLine = document.createElement("div");
                    deletedLine.className = "haolong-report-line haolong-deleted-at";
                    deletedLine.textContent = `DELETED${item.deletedAt ? ` ${formatDeletedTimestamp(item.deletedAt)}` : ""}`;
                    reportText.insertBefore(deletedLine, reportText.firstChild);
                }
            }
            else {
                reportText.textContent = item.report;
            }


            card.appendChild(
                reportText
            );


            /* =================================================
               删除按钮
            ================================================= */

            const deleteButton =
                document.createElement(
                    "button"
                );


            deleteButton.className =
                "report-delete";


            deleteButton.textContent =
                item.cancelled
                    ? "恢复"
                    : "删除";


            deleteButton.onclick =
                function() {

                    cancelReport(
                        item.id
                    );

                };


            card.appendChild(
                deleteButton
            );


            const rebuyButton =
                document.createElement(
                    "button"
                );


            rebuyButton.className =
                "report-rebuy";


            rebuyButton.textContent =
                "重买";


            rebuyButton.onclick =
                function() {

                    rebuyReport(
                        item.id
                    );

                };


            card.appendChild(
                rebuyButton
            );


            const screenshotButton =
                document.createElement("button");

            screenshotButton.className = "report-screenshot";
            screenshotButton.textContent = "截图";
            screenshotButton.onclick = function() {
                screenshotReport(item.id);
            };

            card.appendChild(screenshotButton);


            list.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   金额
===================================================== */

function openReceiptModal(reportId, reportText, product = activeProduct) {
    currentReceiptModalId = reportId;
    receiptModalTitle.textContent = product === "haolong" ? "下注" : "Report";
    receiptModalContent.innerHTML = "";

    if (product === "haolong") {
        receiptModalContent.className = "receipt-modal-content haolong-report-content";
        String(reportText).split(/\r?\n/).forEach(function(line) {
            const row = document.createElement("div");
            row.className = "haolong-report-line";
            if (line === "GX999" || line === "GXX999") {
                const code = document.createElement("span");
                code.className = "haolong-report-blue";
                code.textContent = "GX999";
                row.appendChild(code);
            }
            else {
                const total = line.match(/^GT=(.*)\(MYR\)$/);
                if (total) {
                    row.appendChild(document.createTextNode("GT="));
                    const amount = document.createElement("span");
                    amount.className = "haolong-report-blue";
                    amount.textContent = total[1];
                    row.appendChild(amount);
                    row.appendChild(document.createTextNode("(MYR)"));
                }
                else {
                    row.textContent = line;
                }
            }
            receiptModalContent.appendChild(row);
        });
    }
    else {
        receiptModalContent.className = "receipt-modal-content";
        receiptModalContent.textContent = reportText;
    }

    receiptModal.style.display = "flex";
}


function screenshotModalReceipt() {
    if (currentReceiptModalId !== null) {
        screenshotReport(currentReceiptModalId);
    }
}


function closeReceiptModal() {
    receiptModal.style.display = "none";
    currentReceiptModalId = null;
}


function screenshotReport(reportId) {
    const item = getSavedReports().find(report => report.id === reportId);
    if (!item) {
        alert("找不到这张票单。");
        return;
    }

    const screenshotProduct = item.product || activeProduct;
    let lines = String(item.report || "").split(/\r?\n/);
    const endIndex = lines.findIndex(line => line.trim() === "END");
    if (endIndex >= 0) lines = lines.slice(0, endIndex);
    if (screenshotProduct === "haolong") {
        lines = lines.map(line => line === "GXX999" ? "GX999" : line);
    }

    const canvas = document.createElement("canvas");
    const width = 1000;
    const sidePadding = 50;
    const verticalPadding = 30;
    const fontSize = 40;
    const lineHeight = 62;
    const titleHeight = 0;
    const maxTextWidth = width - sidePadding * 2;
    const measureContext = canvas.getContext("2d");
    measureContext.font = `${fontSize}px Arial, Helvetica, sans-serif`;

    const wrappedLines = [];
    lines.forEach(function(line) {
        if (line === "") {
            wrappedLines.push("");
            return;
        }
        let current = "";
        for (const character of Array.from(line)) {
            const candidate = current + character;
            if (current && measureContext.measureText(candidate).width > maxTextWidth) {
                wrappedLines.push(current);
                current = character;
            }
            else {
                current = candidate;
            }
        }
        wrappedLines.push(current);
    });

    canvas.width = width;
    canvas.height = titleHeight + verticalPadding * 2 + Math.max(1, wrappedLines.length) * lineHeight;
    const context = canvas.getContext("2d");
    context.fillStyle = screenshotProduct === "haolong" ? "#ffffff" : "#eef8ff";
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.strokeStyle = "#dce5eb";
    context.lineWidth = 2;
    context.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);

    context.font = `${fontSize}px Arial, Helvetica, sans-serif`;
    context.textBaseline = "top";
    let y = titleHeight + verticalPadding;
    wrappedLines.forEach(function(line) {
        if (screenshotProduct === "haolong" && line === "GX999") {
            context.fillStyle = "#0000ee";
            context.fillText(line, sidePadding, y);
            context.fillStyle = "#111111";
        }
        else {
            const totalMatch = screenshotProduct === "haolong" && line.match(/^GT=(.*)\(MYR\)$/);
            if (totalMatch) {
                const prefix = "GT=";
                context.fillStyle = "#111111";
                context.fillText(prefix, sidePadding, y);
                const amountX = sidePadding + context.measureText(prefix).width;
                context.fillStyle = "#0000ee";
                context.fillText(totalMatch[1], amountX, y);
                const suffixX = amountX + context.measureText(totalMatch[1]).width;
                context.fillStyle = "#111111";
                context.fillText("(MYR)", suffixX, y);
            }
            else {
                context.fillStyle = "#111111";
                context.fillText(line, sidePadding, y);
            }
        }
        y += lineHeight;
    });

    const dataUrl = canvas.toDataURL("image/png");
    const filename = `receipt-${String(item.count || item.id).replace(/[^a-zA-Z0-9_-]/g, "-")}.png`;
    const base64 = dataUrl.split(",")[1];
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const imageFile = new File([bytes], filename, {type: "image/png"});

    if (navigator.share && navigator.canShare && navigator.canShare({files: [imageFile]})) {
        navigator.share({files: [imageFile], title: "收据截图"}).catch(function(error) {
            if (error.name !== "AbortError") downloadReceiptImage(dataUrl, filename);
        });
        return;
    }

    downloadReceiptImage(dataUrl, filename);
}


function downloadReceiptImage(dataUrl, filename) {
    const link = document.createElement("a");
    link.href = dataUrl;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
}


function updateAmount() {

    const input =
        numberInput.value.trim();


    if (!input) {

        document
            .getElementById(
                "amountDisplay"
            )
            .textContent =
                "$0.00";

        return;

    }


    const lines =
        input
            .split(/\r?\n/)
            .map(
                line =>
                    line.trim()
            )
            .filter(
                line =>
                    line !== ""
            );


    if (
        lines.length < 2
    ) {

        document
            .getElementById(
                "amountDisplay"
            )
            .textContent =
                "$0.00";

        return;

    }


    let headerNumbers =
        lines[0];


    if (
        headerNumbers.startsWith("#")
    ) {

        headerNumbers =
            headerNumbers.substring(1);

    }


    if (
        !/^[0-9]+$/.test(
            headerNumbers
        )
    ) {

        return;

    }


    const headerMultiplier =
        headerNumbers.length;


    const parsed =
        parseNumberLines(
            lines.slice(1),
            headerMultiplier
        );


    if (
        parsed.error
    ) {

        return;

    }


    let total = 0;


    parsed.data.forEach(
        function(item) {

            total +=
                calculateItemTotal(
                    headerMultiplier,
                    item
                );

        }
    );


    const drawDates =
        getDrawDates(
            dateInput.value.trim()
        );


    if (
        drawDates &&
        drawDates.length > 0
    ) {

        total *=
            drawDates.length;

    }


    document
        .getElementById(
            "amountDisplay"
        )
        .textContent =
            `$${total.toFixed(2)}`;

}
